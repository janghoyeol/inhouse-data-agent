  - id: Q19
    db_user: u_e201
    traps: [DT10, DT1]
    question: 주문 a9eec2aaf2814129ba011047ae8484b6이 늦게 도착했대. 규정상 지연 보상 금액은 얼마야?
    expect: answer
    must_cite: ["POL-REF-001@v2#5"]
    gold_sql: |
      SELECT round(sum(dlv_fee) + 0.2 * sum(sale_amt), 2) FROM ord_item WHERE ord_no = 'a9eec2aaf2814129ba011047ae8484b6'
    tol: 0.001
  - id: Q20
    db_user: u_e001
    traps: [DT1, DT10]
    question: 2017년 주문의 환불(취소 환불 제외) 중 당시 규정의 신청 기한보다 늦게 처리된 건은 몇 건이야? 환불 일시를 신청일로 보고.
    expect: answer
    must_cite: ["POL-REF-001@v1#3"]
    gold_sql: |
      SELECT count(*) FROM rfnd r JOIN ord o USING (ord_no)
      WHERE NOT o.is_test AND r.rsn_cd <> 'CNCL'
        AND o.ord_dtm >= TIMESTAMP '2017-01-01' AT TIME ZONE 'America/Sao_Paulo'
        AND o.ord_dtm <  TIMESTAMP '2018-01-01' AT TIME ZONE 'America/Sao_Paulo'
        AND (r.rfnd_dtm AT TIME ZONE 'America/Sao_Paulo')::date > (o.dlv_cust_dtm AT TIME ZONE 'America/Sao_Paulo')::date + 7
