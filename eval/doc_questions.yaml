  - id: Q12
    db_user: u_e201
    traps: [DT7]
    question: 고객이 반품하겠대. 환불 사유 코드는 뭐로 넣어?
    expect: answer
    must_include: [["DMG"], ["WRONG"]]
    must_cite: ["GUIDE-CS-001@v1#2", "GUIDE-CS-001@v1#1"]
  - id: Q13
    db_user: u_e001
    traps: [DT8]
    question: 지표 회의록에 2017년 매출이 약 520만 헤알이라던데, 실제 2017년 순매출은 얼마야?
    expect: answer
    gold_sql: |
      WITH v AS (SELECT ord_no FROM ord WHERE NOT is_test AND stat_cd NOT IN (90, 91)
        AND ord_dtm >= TIMESTAMP '2017-01-01' AT TIME ZONE 'America/Sao_Paulo'
        AND ord_dtm <  TIMESTAMP '2018-01-01' AT TIME ZONE 'America/Sao_Paulo')
      SELECT round((SELECT sum(sale_amt) FROM ord_item JOIN v USING (ord_no))
                 - (SELECT coalesce(sum(rfnd_amt), 0) FROM rfnd JOIN v USING (ord_no)), 2)
  - id: Q14
    db_user: u_e201
    traps: [DT9]
    question: 환불 사유별 환불 건수를 사유 이름과 함께 보여줘.
    expect: answer
    must_include: [["파손"], ["오배송"], ["지연"], ["취소"]]
    gold_sql: SELECT rsn_cd, count(*) FROM rfnd GROUP BY 1
    note: 코드 뜻은 문서(GUIDE-CS-001)와 지표 사전 열 메모 둘 다에 있어 인용은 요구하지 않는다 (첫 측정 후 고침)
