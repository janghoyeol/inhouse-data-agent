  - id: Q18
    db_user: u_e201
    traps: [DT1]
    question: 주문 0032d07457ae9c806c79368d7d9ce96b 상품이 파손돼서 왔대. 배송 완료 다음 날 신청했고 사진 증빙도 있어. 규정상 환불 금액은 얼마야?
