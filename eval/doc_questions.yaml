# 2a-4 문서 질문 정답셋 (ADR 0004). 2026-11-04 Claude 초안 (gold_by: claude-draft) — 결과를 보기 전에 작성.
# 첫 측정 후 고친 것 2개(Q06 금지 낱말이 비교 문장까지 잡음, Q14 함정 전제 틀림)는 eval/RESULTS-docs.md에 기록
# 채점(inhouse.eval.docs_eval)은 규칙 기반이다 (LLM 채점 없음):
# - must_include: 낱말 묶음의 목록. 묶음마다 하나 이상이 답에 있어야 한다 (모든 묶음 필요)
# - must_not_include: 답에 있으면 틀림 (권한 밖 문서 내용이 새는지, 효력 없는 내용을 확정했는지)
# - must_cite: 이 조각 중 하나 이상을 인용해야 한다 (이번 답에서 실제로 받은 조각이어야 함)
# - gold_sql: 있으면 그 결과 숫자(1행 1열 또는 모든 숫자)가 답에 있어야 한다 (반올림 허용 tol)
# - expect: answer = 답해야 함 / not_found = 권한 밖이라 내용을 말하면 안 됨
# traps: docs/doc-notes.md 함정 번호
questions:
  - id: Q01
    db_user: u_e201
    traps: [DT1]
    question: 2017-12-20에 주문해서 2018-01-05에 배송 완료된 주문이 있어. 환불 신청 기한은 언제까지야?
    expect: answer
    must_include: [["2018-01-12", "1월 12일", "01-12", "1/12"]]
    must_cite: ["POL-REF-001@v1#3", "POL-REF-001@v1#2", "POL-REF-001@v2#2"]
  - id: Q02
    db_user: u_e201
    traps: [DT1]
    question: 2018-03-02 주문, 2018-03-10 배송 완료된 주문의 환불 신청 마감일은?
    expect: answer
    must_include: [["2018-03-25", "3월 25일", "03-25", "3/25"]]
    must_cite: ["POL-REF-001@v2#3"]
