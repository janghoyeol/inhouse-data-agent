        AND o.ord_dtm >= TIMESTAMP '2018-01-01' AT TIME ZONE 'America/Sao_Paulo'
        AND o.ord_dtm <  TIMESTAMP '2018-04-01' AT TIME ZONE 'America/Sao_Paulo'
  - id: B10
    category: join
    db_user: u_e001
    question: 2017년 유효 주문 품목 중 고객과 판매자가 같은 주(UF)인 품목의 비율은?
    checks: [T12]
    expect: result
    compare: {rate: true}
    gold_by: claude-draft
    gold_sql: |
      SELECT round(100.0 * count(*) FILTER (WHERE cu.uf = s.uf) / count(*), 2)
      FROM ord o
      JOIN cust cu USING (cust_no)
      JOIN ord_item i USING (ord_no)
      JOIN slr s USING (slr_id)
      WHERE NOT o.is_test AND o.stat_cd NOT IN (90, 91)
        AND o.ord_dtm >= TIMESTAMP '2017-01-01' AT TIME ZONE 'America/Sao_Paulo'
        AND o.ord_dtm <  TIMESTAMP '2018-01-01' AT TIME ZONE 'America/Sao_Paulo'

  # ---- C. 지표: 합의한 지표 정의를 그대로 써야 함 ---------------------------------------------
  - id: C01
    category: metric
    db_user: u_e001
    question: 2017년 매출은 얼마야?
    checks: [net_sales]
    expect: result
    gold_by: claude-draft
    gold_sql: |
      WITH v AS (
        SELECT ord_no FROM ord
        WHERE NOT is_test AND stat_cd NOT IN (90, 91)
          AND ord_dtm >= TIMESTAMP '2017-01-01' AT TIME ZONE 'America/Sao_Paulo'
          AND ord_dtm <  TIMESTAMP '2018-01-01' AT TIME ZONE 'America/Sao_Paulo'
      )
      SELECT round((SELECT coalesce(sum(i.sale_amt), 0) FROM ord_item i JOIN v USING (ord_no))
                 - (SELECT coalesce(sum(r.rfnd_amt), 0) FROM rfnd r JOIN v USING (ord_no)), 2) AS net_sales
  - id: C02
    category: metric
    db_user: u_e001
    question: 2018년 상반기 구매 고객 수는?
    checks: [customer_count, T3]
    expect: result
    gold_by: claude-draft
    gold_sql: |
      SELECT count(DISTINCT c.cust_uid) AS customer_count
      FROM ord o JOIN cust c USING (cust_no)
      WHERE NOT o.is_test AND o.stat_cd NOT IN (90, 91)
        AND o.ord_dtm >= TIMESTAMP '2018-01-01' AT TIME ZONE 'America/Sao_Paulo'
        AND o.ord_dtm <  TIMESTAMP '2018-07-01' AT TIME ZONE 'America/Sao_Paulo'
  - id: C03
    category: metric
    db_user: u_e001
    question: 2017년 재구매율은?
    checks: [repeat_rate, T3]
    expect: result
    compare: {rate: true}
    gold_by: claude-draft
    gold_sql: |
      WITH per AS (
        SELECT c.cust_uid, count(*) AS n
        FROM ord o JOIN cust c USING (cust_no)
        WHERE NOT o.is_test AND o.stat_cd NOT IN (90, 91)
          AND o.ord_dtm >= TIMESTAMP '2017-01-01' AT TIME ZONE 'America/Sao_Paulo'
          AND o.ord_dtm <  TIMESTAMP '2018-01-01' AT TIME ZONE 'America/Sao_Paulo'
        GROUP BY c.cust_uid
      )
      SELECT round(100.0 * count(*) FILTER (WHERE n >= 2) / nullif(count(*), 0), 2) AS repeat_rate_pct FROM per
  - id: C04
    category: metric
    db_user: u_e001
    question: 2017년 11월 객단가는?
    checks: [aov]
    expect: result
    gold_by: claude-draft
    gold_sql: |
      WITH v AS (
        SELECT ord_no FROM ord
        WHERE NOT is_test AND stat_cd NOT IN (90, 91)
          AND ord_dtm >= TIMESTAMP '2017-11-01' AT TIME ZONE 'America/Sao_Paulo'
          AND ord_dtm <  TIMESTAMP '2017-12-01' AT TIME ZONE 'America/Sao_Paulo'
      )
      SELECT round((SELECT coalesce(sum(i.sale_amt), 0) FROM ord_item i JOIN v USING (ord_no))
                   / nullif((SELECT count(*) FROM v), 0), 2) AS aov
  - id: C05
    category: metric
    db_user: u_e001
    question: 2018년 취소율은?
    checks: [cancel_rate]
    expect: result
    compare: {rate: true}
    gold_by: claude-draft
