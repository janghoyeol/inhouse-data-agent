# Tucanova 정답셋 (5단계). 질문 50개 = 5개 분류 × 10.
#
# 정답 SQL(gold_sql)은 호열이 직접 쓴다 (SQL 공부 겸 고객 검수 역할). 쓰는 법은 eval/README.md.
# - db_user: 이 질문을 하는 직원. 정답 SQL도 이 역할로 실행된다 (권한·RLS가 정답에 반영됨)
# - expect: result = 정답 SQL 결과와 비교 / refuse = 권한 밖이라 할 수 없다고 말해야 맞음 (정답 SQL 없음)
# - checks: 이 문항이 보려는 함정·규칙 (schema-notes의 함정 번호 T1~T14, 지표 id)
# - compare: tol(상대 오차, 기본 0.0005), rate(비율이면 true: 0.028과 2.8%를 같게 봄), order_matters(순위 질문)
#
# 함정 번호: T1 테스트 주문, T2 UTC/현지 날짜, T3 cust_no vs cust_uid, T4 상태 코드, T5 환불,
# T6 구 요약표(천 헤알), T7 결제 ≠ 품목, T8 카테고리 결측·미번역, T9 리뷰 중복, T10 좌표 중복,
# T11 탈퇴 고객, T12 약어 열, T13 SELECT * 거절, T14 권역 범위
# gold_by: hoyeol = 호열 작성, together = 같이 작성, claude-draft = Claude 초안(호열 검토 필요)

questions:

  # ---- A. 단순 조회: 표 하나, 함정 적음 -------------------------------------------------
  - id: A01
