      SELECT round(100.0 * count(*) FILTER (WHERE stat_cd IN (90, 91)) / nullif(count(*), 0), 2) AS cancel_rate_pct
      FROM ord
      WHERE NOT is_test
        AND ord_dtm >= TIMESTAMP '2018-01-01' AT TIME ZONE 'America/Sao_Paulo'
        AND ord_dtm <  TIMESTAMP '2019-01-01' AT TIME ZONE 'America/Sao_Paulo'
  - id: C06
    category: metric
    db_user: u_e001
    question: 2017년 환불률은?
    checks: [refund_rate, T5]
    expect: result
    compare: {rate: true}
    gold_by: claude-draft
    gold_sql: |
      SELECT round(100.0 * count(*) FILTER (WHERE EXISTS (
               SELECT 1 FROM rfnd r WHERE r.ord_no = o.ord_no AND r.rsn_cd <> 'CNCL'))
             / nullif(count(*), 0), 2) AS refund_rate_pct
      FROM ord o
      WHERE NOT o.is_test AND o.stat_cd = 60
        AND o.ord_dtm >= TIMESTAMP '2017-01-01' AT TIME ZONE 'America/Sao_Paulo'
        AND o.ord_dtm <  TIMESTAMP '2018-01-01' AT TIME ZONE 'America/Sao_Paulo'
  - id: C07
    category: metric
    db_user: u_e001
    question: 2017년 평균 배송일은 며칠이야?
    checks: [avg_delivery_days]
    expect: result
    gold_by: claude-draft
    gold_sql: |
      SELECT round(avg(extract(epoch FROM dlv_cust_dtm - ord_dtm) / 86400)::numeric, 2) AS avg_delivery_days
      FROM ord
      WHERE NOT is_test AND stat_cd = 60 AND dlv_cust_dtm IS NOT NULL
        AND ord_dtm >= TIMESTAMP '2017-01-01' AT TIME ZONE 'America/Sao_Paulo'
        AND ord_dtm <  TIMESTAMP '2018-01-01' AT TIME ZONE 'America/Sao_Paulo'
  - id: C08
    category: metric
    db_user: u_e001
    question: 2018년 1분기 배송 지연율은?
    checks: [late_rate]
    expect: result
    compare: {rate: true}
    gold_by: claude-draft
    gold_sql: |
      SELECT round(100.0 * count(*) FILTER (
               WHERE (dlv_cust_dtm AT TIME ZONE 'America/Sao_Paulo')::date > est_dlv_dt)
             / nullif(count(*), 0), 2) AS late_rate_pct
      FROM ord
      WHERE NOT is_test AND stat_cd = 60 AND dlv_cust_dtm IS NOT NULL
        AND ord_dtm >= TIMESTAMP '2018-01-01' AT TIME ZONE 'America/Sao_Paulo'
        AND ord_dtm <  TIMESTAMP '2018-04-01' AT TIME ZONE 'America/Sao_Paulo'
  - id: C09
    category: metric
    db_user: u_e001
    question: 2017년 평균 리뷰 점수는?
    checks: [avg_review_score, T9]
    expect: result
    gold_by: claude-draft
    gold_sql: |
      WITH last AS (
        SELECT DISTINCT ON (r.ord_no) r.ord_no, r.score
        FROM rvw r JOIN ord o USING (ord_no)
        WHERE NOT o.is_test
          AND o.ord_dtm >= TIMESTAMP '2017-01-01' AT TIME ZONE 'America/Sao_Paulo'
          AND o.ord_dtm <  TIMESTAMP '2018-01-01' AT TIME ZONE 'America/Sao_Paulo'
        ORDER BY r.ord_no, r.ans_dtm DESC NULLS LAST, r.rvw_sn DESC
      )
      SELECT round(avg(score), 2) AS avg_review_score FROM last
  - id: C10
    category: metric
    db_user: u_e001
    question: 2017년 총거래액(GMV)은?
    checks: [gmv]
    expect: result
    gold_by: claude-draft
    gold_sql: |
      SELECT round(coalesce(sum(i.sale_amt + i.dlv_fee), 0), 2) AS gmv
      FROM ord o JOIN ord_item i USING (ord_no)
      WHERE NOT o.is_test AND o.stat_cd NOT IN (90, 91)
        AND o.ord_dtm >= TIMESTAMP '2017-01-01' AT TIME ZONE 'America/Sao_Paulo'
        AND o.ord_dtm <  TIMESTAMP '2018-01-01' AT TIME ZONE 'America/Sao_Paulo'

  # ---- D. 함정: 순진한 SQL이면 틀리는 질문 --------------------------------------------------
  - id: D01
