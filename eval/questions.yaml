  # ---- B. 조인: 표 여러 개를 이어야 함 ------------------------------------------------------
  - id: B01
    category: join
    db_user: u_e001
    question: 2017년 판매가 합계 기준 상위 5개 카테고리(영문명)와 금액을 보여줘.
    checks: [T8, T1, T4]
    expect: result
    compare: {order_matters: true}
    gold_by: claude-draft
    gold_sql: |
      SELECT coalesce(c.ctgr_nm_en, p.ctgr_cd, '미분류') AS category, sum(i.sale_amt) AS sales
      FROM ord o
      JOIN ord_item i USING (ord_no)
      JOIN prd p USING (prd_id)
      LEFT JOIN ctgr c ON c.ctgr_cd = p.ctgr_cd
      WHERE NOT o.is_test AND o.stat_cd NOT IN (90, 91)
        AND o.ord_dtm >= TIMESTAMP '2017-01-01' AT TIME ZONE 'America/Sao_Paulo'
        AND o.ord_dtm <  TIMESTAMP '2018-01-01' AT TIME ZONE 'America/Sao_Paulo'
      GROUP BY 1
      ORDER BY sales DESC
      LIMIT 5
  - id: B02
    category: join
    db_user: u_e001
    question: 2017년 권역별 주문 수를 보여줘.
    checks: [order_count, T14]
    expect: result
    gold_by: claude-draft
    gold_sql: |
      SELECT r.rgn_nm_ko, count(*)
      FROM ord o
      JOIN cust cu USING (cust_no)
      JOIN st USING (uf)
      JOIN rgn r USING (rgn_cd)
      WHERE NOT o.is_test AND o.stat_cd NOT IN (90, 91)
        AND o.ord_dtm >= TIMESTAMP '2017-01-01' AT TIME ZONE 'America/Sao_Paulo'
        AND o.ord_dtm <  TIMESTAMP '2018-01-01' AT TIME ZONE 'America/Sao_Paulo'
      GROUP BY r.rgn_nm_ko
  - id: B03
    category: join
    db_user: u_e001
    question: 2018년 판매가 합계가 가장 큰 판매자 소재 주(UF) 3곳은?
    checks: [T1, T4]
    expect: result
    compare: {order_matters: true}
    gold_by: claude-draft
    gold_sql: |
      SELECT s.uf, sum(i.sale_amt) AS sales
      FROM ord o
      JOIN ord_item i USING (ord_no)
      JOIN slr s USING (slr_id)
      WHERE NOT o.is_test AND o.stat_cd NOT IN (90, 91)
        AND o.ord_dtm >= TIMESTAMP '2018-01-01' AT TIME ZONE 'America/Sao_Paulo'
        AND o.ord_dtm <  TIMESTAMP '2019-01-01' AT TIME ZONE 'America/Sao_Paulo'
      GROUP BY s.uf
      ORDER BY sales DESC
      LIMIT 3
  - id: B04
    category: join
    db_user: u_e001
    question: 2017년 배송 완료 주문이 300건 이상인 주(고객 기준) 중 배송 지연율이 가장 높은 3곳은?
    checks: [late_rate, T2]
    expect: result
    compare: {order_matters: true, rate: true}
    gold_by: claude-draft
    gold_sql: |
      SELECT cu.uf,
             round(100.0 * count(*) FILTER (WHERE (o.dlv_cust_dtm AT TIME ZONE 'America/Sao_Paulo')::date > o.est_dlv_dt)
                   / count(*), 2) AS late_rate_pct
      FROM ord o JOIN cust cu USING (cust_no)
      WHERE NOT o.is_test AND o.stat_cd = 60 AND o.dlv_cust_dtm IS NOT NULL
        AND o.ord_dtm >= TIMESTAMP '2017-01-01' AT TIME ZONE 'America/Sao_Paulo'
        AND o.ord_dtm <  TIMESTAMP '2018-01-01' AT TIME ZONE 'America/Sao_Paulo'
      GROUP BY cu.uf
      HAVING count(*) >= 300
      ORDER BY late_rate_pct DESC
      LIMIT 3
  - id: B05
    category: join
    db_user: u_e001
    question: 리뷰가 500건 이상인 카테고리 중 평균 리뷰 점수가 가장 낮은 3개(영문명)는?
    checks: [avg_review_score, T9, T8]
    expect: result
    compare: {order_matters: true}
    gold_by: claude-draft
    gold_sql: |
      WITH last AS (   -- 주문당 최신 리뷰 1건 (avg_review_score 정의)
        SELECT DISTINCT ON (r.ord_no) r.ord_no, r.score
        FROM rvw r JOIN ord o USING (ord_no)
        WHERE NOT o.is_test
        ORDER BY r.ord_no, r.ans_dtm DESC NULLS LAST, r.rvw_sn DESC
      ), oc AS (       -- 주문 × 카테고리 (같은 주문의 같은 카테고리 품목은 한 번)
        SELECT DISTINCT i.ord_no, coalesce(c.ctgr_nm_en, p.ctgr_cd) AS category
        FROM ord_item i JOIN prd p USING (prd_id) LEFT JOIN ctgr c ON c.ctgr_cd = p.ctgr_cd
        WHERE p.ctgr_cd IS NOT NULL   -- 카테고리 없는 상품은 카테고리 순위에서 뺀다
      )
      SELECT oc.category, round(avg(last.score), 2) AS avg_score
      FROM last JOIN oc USING (ord_no)
      GROUP BY oc.category
      HAVING count(*) >= 500
      ORDER BY avg_score ASC
      LIMIT 3
  - id: B06
    category: join
    db_user: u_e001
    question: 2017년 월별 순매출을 보여줘.
    checks: [net_sales, T2, T5]
    expect: result
    compare: {order_matters: true}
    gold_by: claude-draft
    gold_sql: |
      WITH v AS (
        SELECT o.ord_no, to_char(o.ord_dtm AT TIME ZONE 'America/Sao_Paulo', 'YYYY-MM') AS ym
        FROM ord o
        WHERE NOT o.is_test AND o.stat_cd NOT IN (90, 91)
          AND o.ord_dtm >= TIMESTAMP '2017-01-01' AT TIME ZONE 'America/Sao_Paulo'
          AND o.ord_dtm <  TIMESTAMP '2018-01-01' AT TIME ZONE 'America/Sao_Paulo'
      ), s AS (SELECT v.ym, sum(i.sale_amt) AS amt FROM v JOIN ord_item i USING (ord_no) GROUP BY v.ym),
      r AS (SELECT v.ym, sum(f.rfnd_amt) AS amt FROM v JOIN rfnd f USING (ord_no) GROUP BY v.ym)
      SELECT s.ym, round(s.amt - coalesce(r.amt, 0), 2) AS net_sales
      FROM s LEFT JOIN r USING (ym)
      ORDER BY s.ym
  - id: B07
    category: join
    db_user: u_e001
    question: 품목이 가장 많이 들어간 주문에는 품목이 몇 개 있어?
