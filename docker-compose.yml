# 로컬 개발용. 비밀번호는 로컬 전용 값이다 (배포에 쓰지 않음).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tucanova
      POSTGRES_PASSWORD: tucanova-local
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30
  loader:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:tucanova-local@db:5432/tucanova
      TCN_USER_PASSWORD: tucanova-local   # 직원 역할(u_e001 …) 공통 비밀번호, 로컬 전용
    volumes: [rawdata:/data]
    depends_on:
      db: {condition: service_healthy}
    profiles: [tools]
  web:
    build: .
    command: ["uvicorn", "inhouse.web.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql://db:5432/tucanova      # 직원 역할로 접속하므로 사용자 없이
      TCN_USER_PASSWORD: tucanova-local
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}           # 실행하는 쪽 환경변수에서
      DAILY_COST_CAP_USD: "0.5"
      AUDIT_PATH: /data/audit.jsonl
    ports: ["8000:8000"]
    volumes: [rawdata:/data]
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
  rawdata:
