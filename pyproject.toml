[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inhouse-data-agent"
version = "0.1.0"
description = "가상 고객사 사내 DB에 권한 안에서 자연어로 묻고 SQL 출처와 함께 답하는 데이터 에이전트"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "sqlglot>=30,<31",
    "pyyaml>=6",
    "tzdata>=2024.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"inhouse.data" = ["schema.sql", "security.sql"]
"inhouse.agent" = ["metrics.yaml"]
